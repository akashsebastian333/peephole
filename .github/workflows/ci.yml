name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: gofmt
        run: test -z "$(gofmt -l *.go cmd internal)" || (gofmt -l *.go cmd internal && echo "run gofmt -w" && exit 1)

      - name: generated KB is fresh
        run: go run ./cmd/kbgen --check

      # bin/manifest.sha256 pins every shipped artifact plus hooks/, skills/ and
      # .claude-plugin/plugin.json. If it drifts, `peephole selfcheck` fails and
      # every SessionStart prints an INTEGRITY ALARM about possible tampering — on
      # every install. Editing a pinned file without re-running ./build.sh is an
      # easy and silent way to do that; nothing else in CI catches it, because the
      # committed manifest is self-consistent with the committed manifest.
      - name: integrity manifest is fresh
        run: |
          cp bin/manifest.sha256 /tmp/manifest.before
          ./build.sh >/dev/null
          if ! diff -q /tmp/manifest.before bin/manifest.sha256 >/dev/null; then
            echo "::error::bin/manifest.sha256 is stale - run ./build.sh and commit the result"
            diff -u /tmp/manifest.before bin/manifest.sha256 || true
            exit 1
          fi
          echo "integrity manifest matches a fresh build"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test (race)
        run: go test -race ./...

      - name: rules are valid JSON
        run: |
          for f in rules/*.json taint/*.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done

      - name: cross-compile all targets
        run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o /dev/null .
          done
