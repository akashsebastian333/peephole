name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned to an exact patch, not '1.26'. The compiler is an input to the
          # build, so a floating minor makes two releases of the same source
          # produce different binaries and defeats the reproducibility the
          # -trimpath -buildvcs=false flags exist to provide. Bump deliberately.
          go-version: '1.26.6'
          cache: false

      # A tag must not be able to ship what CI would have rejected. Without these
      # two gates a release can carry a stale embedded KB (rules/*.json edited but
      # rules_gen.go not regenerated) or a failing test suite, and the published
      # artifact is what operators actually install.
      - name: generated KB is fresh
        run: go run ./cmd/kbgen --check

      - name: go test
        run: go test ./...

      - name: version matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            grep -q "\"version\": \"$v\"" "$f" || { echo "$f does not declare version $v"; exit 1; }
          done
          grep -q "^const version = \"$v\"\$" version.go || { echo "version.go does not declare $v"; exit 1; }
          echo "version $v consistent across version.go and both manifests"

      - name: build all targets
        run: |
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}
            out="dist/peephole-$os-$arch"; [ "$os" = windows ] && out="$out.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags="-s -w" -o "$out" .
          done
          cd dist && sha256sum peephole-* > SHA256SUMS

      # Scan the ARTIFACTS, not the source. The daily security-scan workflow runs
      # `govulncheck ./...` in source mode, which resolves the stdlib from whatever
      # toolchain setup-go just installed — so it reported "0 vulnerabilities" while
      # the committed binaries, built with go1.26.0, carried 32 reachable stdlib
      # CVEs. Source mode structurally cannot detect a stale BUILD toolchain.
      # Binary mode reads the version baked into each artifact, which is what
      # operators actually install, so a stale toolchain now fails the release.
      - name: govulncheck the built artifacts
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          gv="$(go env GOPATH)/bin/govulncheck"
          rc=0
          for b in dist/peephole-*; do
            case "$b" in *SHA256SUMS) continue;; esac
            echo "--- $b"
            "$gv" -mode=binary "$b" || rc=1
          done
          exit $rc

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --title "${{ github.ref_name }}" --generate-notes
