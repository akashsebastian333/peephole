name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: generated KB is fresh
        run: go run ./cmd/kbgen --check

      - name: go test
        run: go test ./...

      - name: version matches the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            grep -q "\"version\": \"$v\"" "$f" || { echo "$f does not declare version $v"; exit 1; }
          done
          grep -q "^const version = \"$v\"\$" version.go || { echo "version.go does not declare $v"; exit 1; }
          echo "version $v consistent across version.go and both manifests"

      - name: build all targets
        run: |
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}
            out="dist/peephole-$os-$arch"; [ "$os" = windows ] && out="$out.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags="-s -w" -o "$out" .
          done
          cd dist && sha256sum peephole-* > SHA256SUMS

      - name: govulncheck the shipped code (unstripped scan build)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          gv="$(go env GOPATH)/bin/govulncheck"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /tmp/scan-target .
          "$gv" -mode=binary /tmp/scan-target

      - name: artifacts were built by the pinned toolchain
        run: |
          want="$(grep -oE '^toolchain go[0-9.]+' go.mod | sed 's/toolchain //')"
          rc=0
          for b in dist/peephole-*; do
            case "$b" in *SHA256SUMS) continue;; esac
            got="$(go version -m "$b" | head -1 | grep -oE 'go1[0-9.]+')"
            [ "$got" = "$want" ] && echo "ok   $b ($got)" || { echo "FAIL $b: built by $got, expected $want"; rc=1; }
          done
          exit $rc

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --title "${{ github.ref_name }}" --generate-notes
